name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}
          # No es secreta: acaba en el JS público. La variable de GitHub, si existe, tiene prioridad.
          VITE_AIRTABLE_WEBHOOK_URL: ${{ vars.VITE_AIRTABLE_WEBHOOK_URL || 'https://hooks.airtable.com/workflows/v1/genericWebhook/appXyHBvh2D87qmQE/wfle3Jdu3AsN17hrN/wtrMJE4aeB9zT2T7S' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
